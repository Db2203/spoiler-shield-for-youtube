<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spoiler Shield for YouTube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Spoiler Shield</h1>
      <label class="switch" title="Turn the shield on or off">
        <input type="checkbox" id="enabled" />
        <span class="track"><span class="thumb"></span></span>
        <span class="switch-label" id="enabled-label">On</span>
      </label>
    </header>

    <section class="stats" aria-label="Hidden item counts">
      <div class="stat">
        <span class="stat-value" id="count-page">–</span>
        <span class="stat-label">hidden on this page</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="count-total">0</span>
        <span class="stat-label">hidden in total</span>
      </div>
    </section>

    <section class="notice" id="permission" hidden>
      <p>The shield does not have access to youtube.com yet.</p>
      <button type="button" id="grant">Allow on youtube.com</button>
    </section>

    <section class="options">
      <label class="option">
        <input type="checkbox" id="blur" />
        <span>
          <span class="option-title">Blur all thumbnails</span>
          <span class="option-hint">Click a thumbnail once to reveal it.</span>
        </span>
      </label>
      <label class="option">
        <input type="checkbox" id="strict" />
        <span>
          <span class="option-title">Strict mode</span>
          <span class="option-hint">No reveal: blurred thumbnails stay blurred and blocked pages cannot be shown.</span>
        </span>
      </label>
    </section>

    <section class="summary" id="summary" aria-label="Active keyword lists">
      <span><strong id="strong-count">0</strong> strong keywords</span>
      <span><strong id="weak-count">0</strong> weak keywords</span>
      <span><strong id="channel-count">0</strong> blocked channels</span>
    </section>

    <footer>
      <button type="button" id="manage">Manage keywords and channels</button>
      <span class="status" id="status" aria-live="polite"></span>
    </footer>

    <script src="../content/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
