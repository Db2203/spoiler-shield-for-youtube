<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Community - YouTube</title>
    <link rel="stylesheet" href="/mock.css" />
    <script src="/mock.js"></script>
    <style>
      ytd-backstage-post-thread-renderer, ytd-post-renderer { display: block; }
      ytd-backstage-post-thread-renderer { margin: 16px 24px; padding: 16px; background: #1a1a1a; border-radius: 12px; }
    </style>
  </head>
  <body>
    <ytd-app>
      <ytd-masthead id="masthead"><input type="text" placeholder="Search" aria-label="Search" /></ytd-masthead>
      <div id="content">
        <ytd-page-manager id="page-manager">
          <ytd-browse page-subtype="channels">
            <ytd-section-list-renderer>
              <ytd-item-section-renderer>
                <div id="contents" data-mock-contents data-mock-kind="post"></div>
              </ytd-item-section-renderer>
            </ytd-section-list-renderer>
          </ytd-browse>
        </ytd-page-manager>
      </div>
    </ytd-app>

    <!-- Invented content. "Zorblax Quest 9" is a fictional game. -->
    <script type="application/json" data-mock-items="[data-mock-contents]">
      [
        { "id": "p1", "channel": "Kitchen Corner", "handle": "kitchencorner", "text": "New bread video drops on Friday." },
        { "id": "p2", "channel": "Game Gossip", "handle": "gamegossip", "text": "Our Zorblax Quest 9 coverage starts tomorrow, stay tuned." },
        { "id": "p3", "channel": "Food Finder", "handle": "foodfinder", "text": "Poll: pizza or pasta for the next episode?" },
        { "id": "p4", "channel": "Lore Library", "handle": "lorelibrary", "text": "Thanks for 100k subscribers!" }
      ]
    </script>
  </body>
</html>
